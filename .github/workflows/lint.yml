name: Lint

# Fast signal on every PR and push to main, before anyone spends time on a
# multi-architecture build.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  addon:
    name: Add-on config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint mistralvibe
        uses: frenck/action-addon-linter@v2
        with:
          path: ./mistralvibe

  dockerfile:
    name: Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: mistralvibe/Dockerfile
          # DL3015: apt-get without pinned versions. The add-on deliberately
          # follows Debian bookworm; pinning here would break security updates.
          ignore: DL3015
          failure-threshold: error
