configuration:
  mistral_api_key:
    name: Mistral API key
    description: >-
      API key from https://console.mistral.ai/. Stored securely in
      /data/vibe/.env inside the app.
  active_model:
    name: Active model
    description: >-
      Default Mistral model for new sessions — any model id from
      https://docs.mistral.ai/models (e.g. mistral-medium-latest). Validated
      against the live API at startup. Can be changed at any time inside Vibe
      with the /config command.
  default_agent:
    name: Default agent
    description: >-
      "default" requires confirmation for every tool call. "plan" is a
      read-only agent that can explore your config but never write or run
      anything.
  auto_approve:
    name: Auto-approve tool calls
    description: >-
      Skip the confirmation prompt before Vibe runs tools. Faster workflows,
      higher risk — leave this off unless you know what you're doing.
  auto_update_cli:
    name: Auto-update Vibe CLI
    description: >-
      Allow the bundled Mistral Vibe CLI to self-update on launch when a newer
      release is available on PyPI.
  enable_telemetry:
    name: Enable Vibe telemetry
    description: >-
      Forwarded to Vibe's own telemetry flag. Off by default.
  log_level:
    name: Log level
    description: >-
      Verbosity of the underlying terminal server (ttyd).
  terminal_font_size:
    name: Terminal font size
    description: >-
      Font size for the web terminal in pixels (10-24).
  terminal_theme:
    name: Terminal theme
    description: >-
      Color theme for the web terminal. dark or light.
  reset_data:
    name: Reset app data
    description: >-
      Wipe /data/vibe on next start. Resets config, history and session logs.
      Set back to false after use.
  session_persistence:
    name: Session persistence
    description: >-
      Keep the terminal session alive when the browser tab is closed (via tmux).
      Disable if you have copy/paste issues.
  default_task_model:
    name: Default task model
    description: >-
      Model alias used for headless tasks sent to the app's POST /task
      endpoint. Empty = the active_model from this app.
  task_max_runtime_minutes:
    name: Task max runtime (minutes)
    description: >-
      Maximum runtime of a headless task (1-240 minutes). The task is killed
      when the limit is reached.
  task_token:
    name: Task endpoint token
    description: >-
      Bearer token required for POST /task (headless tasks from automations).
      Leave empty to auto-generate a random one on first boot — it is persisted
      in /data/vibe/.env and reused across restarts. Read it in the app terminal
      via: grep TASK_TOKEN /data/vibe/.env
  auto_launch:
    name: Auto-launch Vibe
    description: >-
      What happens when the web terminal opens. "new" starts a fresh Vibe
      session, "continue" resumes the last one, "off" gives you a plain shell.
  working_directory:
    name: Working directory
    description: >-
      Directory Vibe starts in (and headless tasks run from). Must be a mapped
      folder, e.g. /config, /share or /media.
  mcp_source:
    name: MCP server source
    description: >-
      "builtin" runs a local ha-mcp server inside this app (loopback only).
      "external" connects Vibe to an external ha-mcp server — e.g. the HA-MCP
      HACS integration, with its GUI, read-only mode and tool selection.
  external_mcp_url:
    name: External MCP URL
    description: >-
      Streamable-HTTP MCP endpoint of the external ha-mcp server, only used
      when MCP server source is "external" — e.g. the HA-MCP integration's
      private URL (http://<ha-ip>:9584/private_... — the secret path itself is the MCP endpoint, no /mcp suffix). Required in external
      mode. Stored in /data/vibe/config.toml (chmod 600) — the URL may embed a
      secret path.
  external_mcp_token:
    name: External MCP token
    description: >-
      Optional bearer token sent to the external MCP server
      (Authorization: Bearer ...). Leave empty for secret-path URLs. Stored in
      /data/vibe/.env, never in config.toml.

network:
  7681/tcp: Web terminal (ingress only — no host port required)
