configuration:
  mistral_api_key:
    name: Mistral API-Key
    description: >-
      API-Key von https://console.mistral.ai/. Wird sicher in
      /data/vibe/.env innerhalb des Add-ons gespeichert.
  active_model:
    name: Aktives Modell
    description: >-
      Standard-Mistral-Modell für neue Sitzungen — jede Modell-ID von
      https://docs.mistral.ai/models (z. B. mistral-medium-latest). Wird beim
      Start gegen die Live-API geprüft. Kann jederzeit innerhalb von Vibe mit
      dem /config-Befehl geändert werden.
  default_agent:
    name: Standard-Agent
    description: >-
      "default" verlangt vor jedem Tool-Aufruf eine Bestätigung. "plan" ist
      ein Read-only-Agent, der deine Konfiguration erkunden, aber nichts
      schreiben oder ausführen kann.
  auto_approve:
    name: Tool-Aufrufe automatisch zulassen
    description: >-
      Überspringt die Bestätigung vor jedem Tool-Aufruf. Schneller, aber
      riskanter — nur aktivieren, wenn du genau weißt, was du tust.
  auto_update_cli:
    name: Vibe CLI automatisch aktualisieren
    description: >-
      Erlaubt der mitgelieferten Mistral Vibe CLI, sich beim Start zu
      aktualisieren, sobald eine neuere Version auf PyPI verfügbar ist.
  enable_telemetry:
    name: Vibe-Telemetrie aktivieren
    description: >-
      Setzt das interne Telemetrie-Flag von Vibe. Standardmäßig aus.
  log_level:
    name: Log-Level
    description: >-
      Detailgrad des zugrundeliegenden Terminal-Servers (ttyd).
  terminal_font_size:
    name: Schriftgröße Terminal
    description: >-
      Schriftgröße des Web-Terminals in Pixeln (10-24).
  terminal_theme:
    name: Terminal-Theme
    description: >-
      Farbschema des Web-Terminals. dark oder light.
  reset_data:
    name: App-Daten zurücksetzen
    description: >-
      Löscht /data/vibe beim nächsten Start. Danach manuell wieder auf false setzen.
  session_persistence:
    name: Session-Persistenz
    description: >-
      Terminal-Session beim Schließen des Browser-Tabs am Leben halten (via tmux).
      Deaktivieren wenn Copy/Paste nicht funktioniert.
  default_task_model:
    name: Standard-Modell für Aufgaben
    description: >-
      Modell-Alias für headless Aufgaben an den POST /task-Endpunkt der App.
      Leer = das aktive Modell der App.
  task_max_runtime_minutes:
    name: Max. Aufgaben-Laufzeit (Minuten)
    description: >-
      Maximale Laufzeit einer headless Aufgabe (1-240 Minuten). Die Aufgabe
      wird nach Ablauf dieser Zeit beendet.
  task_token:
    name: Token für Aufgaben-Endpunkt
    description: >-
      Bearer-Token für POST /task (headless Aufgaben aus Automationen).
      Leer lassen, um beim ersten Start ein zufälliges zu erzeugen — es wird in
      /data/vibe/.env persistiert und über Neustarts hinweg wiederverwendet.
      Auslesbar im App-Terminal via: grep TASK_TOKEN /data/vibe/.env
  auto_launch:
    name: Vibe automatisch starten
    description: >-
      Was passiert, wenn das Web-Terminal geöffnet wird. "new" startet eine
      neue Vibe-Sitzung, "continue" setzt die letzte fort, "off" gibt einen
      normalen Shell-Prompt.
  working_directory:
    name: Arbeitsverzeichnis
    description: >-
      Verzeichnis, in dem Vibe startet (und headless Aufgaben laufen). Muss ein
      gemapptes Verzeichnis sein, z. B. /config, /share oder /media.
  mcp_source:
    name: MCP-Server-Quelle
    description: >-
      "builtin" startet einen lokalen ha-mcp-Server in dieser App (nur
      Loopback). "external" verbindet Vibe mit einem externen ha-mcp-Server —
      z. B. der HA-MCP-HACS-Integration mit GUI, Read-only-Modus und
      Tool-Auswahl.
  external_mcp_url:
    name: Externe MCP-URL
    description: >-
      Streamable-HTTP-MCP-Endpunkt des externen ha-mcp-Servers, nur genutzt bei
      MCP-Server-Quelle "external" — z. B. die private URL der HA-MCP-Integration
      (http://<ha-ip>:9584/private_.../mcp). In external Pflicht. Wird in
      /data/vibe/config.toml (chmod 600) gespeichert — die URL kann einen
      geheimen Pfad enthalten.
  external_mcp_token:
    name: Externes MCP-Token
    description: >-
      Optionales Bearer-Token für den externen MCP-Server (Authorization:
      Bearer ...). Leer lassen bei Secret-Path-URLs. Wird in /data/vibe/.env
      gespeichert, nie in config.toml.

network:
  7681/tcp: Web-Terminal (nur Ingress — kein Host-Port nötig)
